# Sitio principal circulovicioso.club: paginas fijas (sin PHP), servidas por un Caddy chico de solo
# lectura. El Caddy de CV Chat le llega por la red foro-frente (sin salida a internet).
name: sitio
services:
  sitio:
    image: caddy:2
    container_name: sitio-web
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":80"]
    volumes:
      - ./web:/srv:ro
    networks: [foro-frente]
    read_only: true
    tmpfs: [/data, /config]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }
networks:
  foro-frente: { external: true }
