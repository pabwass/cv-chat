# Haven + Caddy (HTTPS automatico). Todo vive en /opt/haven:
#   haven-data/   base de datos, .env de Haven, archivos subidos
#   caddy-data/   certificados HTTPS
# Para migrar: copiar /opt/haven entero a otro servidor y `docker compose up -d`.
services:
  haven:
    # Version fijada (4.23.0): el puente, el tema y patches/ se revisaron para esta version. Revisarlos antes de actualizar.
    # Antes de pasar a 4.23.0 se marco import_authors_cleared=1 en server_settings: esa migracion de
    # Haven le saca el dueño a los mensajes importados, y aca son del usuario discord-historial a proposito.
    image: ghcr.io/ancsemi/haven@sha256:f17925ccfef01fb4140b74f5114ce4de62b9c3f22d95edb7b3b488d698e2d8ea
    container_name: haven
    volumes:
      - ./haven-data:/data
      # Los parches del importador de Discord (app-discord-import.js e import.js) ya vienen en Haven 4.23.0.
      - ./patches/import-timeout.js:/patches/import-timeout.js:ro
      # Herramientas propias (script de hilos y privados, ejecutado por haven-hilos.timer)
      - ./tools:/tools
      # Tema Discord+ (solo aspecto) y su fuente Inter, servidos desde /themes
      - ./tema/discord-plus.theme.css:/app/themes/discord-plus.theme.css:ro
      - ./tema/inter-latin-wght-normal.woff2:/app/themes/inter-latin-wght-normal.woff2:ro
      - ./tema/inter-latin-ext-wght-normal.woff2:/app/themes/inter-latin-ext-wght-normal.woff2:ro
    env_file: .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - FORCE_HTTP=true
      # PARCHE: ver patches/import-timeout.js
      - NODE_OPTIONS=--require /patches/import-timeout.js --require /tools/puente/cargar.js
    restart: unless-stopped
    # Registros: hasta 10 archivos de 100 MB (1 GB) por programa; recien ahi se borran los mas viejos
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      - haven
    restart: unless-stopped
    # Registros: hasta 10 archivos de 100 MB (1 GB) por programa; recien ahi se borran los mas viejos
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
