# Foro de Circulo Vicioso (vBulletin), aislado de CV Chat. Todo vive en /opt/foro:
#   codigo/      vBulletin (solo lectura para el foro)
#   escribible/  lo unico donde el foro puede escribir (caches)
#   db/          la base de datos (MariaDB)
#   .env         contraseñas y la clave de envio de mails (solo root)
#   puente.env   la clave compartida con CV Chat (solo root, solo para web)
# Redes: el foro no tiene salida a internet. Caddy (el de CV Chat) le llega por foro-frente; los
# mails salen por "correo" (Postfix), lo unico con salida, y solo hacia Resend.
name: foro
services:
  web:
    build: ./imagen
    image: foro-web:local
    container_name: foro-web
    # La clave compartida con CV Chat para cvchat.php (CV_PUENTE_SECRETO, CV_CHAT_URL)
    env_file: puente.env
    volumes:
      - ./codigo:/var/www/html:ro
      - ./escribible/cache:/var/www/html/cache
      - ./escribible/core-cache:/var/www/html/core/cache
    networks: [foro-frente, foro-datos]
    depends_on: [db, correo]
    read_only: true
    tmpfs: [/tmp, /run/apache2, /var/run/apache2, /var/lock/apache2]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    mem_limit: 1536m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }
  db:
    image: mariadb:11.4
    container_name: foro-db
    env_file: .env
    environment:
      - MARIADB_DATABASE=foro
      - MARIADB_USER=foro
    volumes:
      - ./db:/var/lib/mysql
    networks: [foro-datos]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=64M", "--innodb-buffer-pool-size=512M"]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }
  correo:
    image: boky/postfix:latest
    container_name: foro-correo
    env_file: .env
    environment:
      - RELAYHOST=[smtp.resend.com]:587
      - RELAYHOST_USERNAME=resend
      - ALLOWED_SENDER_DOMAINS=circulovicioso.club
      - POSTFIX_myhostname=foro.circulovicioso.club
      - MYNETWORKS=172.16.0.0/12 10.0.0.0/8 192.168.0.0/16 127.0.0.0/8
    networks: [foro-datos, foro-salida]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }
networks:
  foro-frente: { name: foro-frente, internal: true }
  foro-datos: { name: foro-datos, internal: true }
  foro-salida: { name: foro-salida }
