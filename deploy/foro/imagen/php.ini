; Foro: limites razonables y sin funciones para ejecutar comandos (lo que usaban las puertas traseras)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60
expose_php = Off
allow_url_include = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,proc_nice,dl,putenv,mail
date.timezone = America/Argentina/Buenos_Aires
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
session.cookie_httponly = 1
