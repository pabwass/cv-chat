# La IP real de cada visita viene de Caddy
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes +FollowSymLinks
</Directory>
# En las carpetas de imagenes, archivos y caches no se ejecuta PHP nunca
<DirectoryMatch "^/var/www/html/(images|fonts|js|cache|core/images|core/cache|core/cpstyles|core/clientscript|core/store_sitemap)(/|$)">
    <FilesMatch "\.(php|phtml|phar|php\d|inc)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
# Ni archivos ocultos, de respaldo o de configuracion sueltos
<FilesMatch "(^\.|\.(bak|bkp|old|orig|sql|gz|tar|zip|sh|log)$)">
    Require all denied
</FilesMatch>
ErrorLog /dev/stderr
CustomLog /dev/stdout combined
# La barra de arriba de Circulo Vicioso (la misma que en la web, tools/puente/web/barra.*) y la
# cuenta unica: se agrega a las paginas del foro, menos a los paneles de control y al puente con CV Chat
# (por la direccion que se pidio: el foro las pasa por index.php por dentro)
<If "! %{THE_REQUEST} =~ m#^[A-Z]+ /(core/|admincp|modcp|cvchat\.php)#">
    AddOutputFilterByType SUBSTITUTE text/html
    SubstituteMaxLineLength 10M
    Substitute "s|</head>|<link rel=\"stylesheet\" href=\"${CV_CHAT_URL}/puente/barra.css\"><script src=\"${CV_CHAT_URL}/puente/barra.js\" defer></script></head>|i"
</If>
