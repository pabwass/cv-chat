<script>
(function () {
  // El buscador del foro, abajo de la cabecera (a la derecha de "Nuevos temas"...)
  function mover() {
    var f = document.getElementById('searchForm'), s = document.getElementById('channel-subtabbar');
    if (!f || !s || s.querySelector('.cv-buscar')) return;
    var d = document.createElement('div'); d.className = 'cv-buscar'; d.appendChild(f); s.appendChild(d);
  }
  if (document.readyState !== 'loading') mover(); else document.addEventListener('DOMContentLoaded', mover);
})();
</script>
